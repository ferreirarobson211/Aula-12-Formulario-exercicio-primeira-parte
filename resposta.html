<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  
</head>
<body>

  <div class="card">
   
    <form action="resposta.html">
      <h2>Cadastro de Usuário</h2>

      <div class="form-group">
        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" minlength="3" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
      </div>

      <div class="form-group">
        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" name="idade" min="18" max="100" placeholder="18 a 100" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" minlength="6" placeholder="Mínimo 6 caracteres" required>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" pattern="[0-9]{5}-[0-9]{4}" placeholder="99999-9999">
      </div>

      <button type="submit">Cadastrar</button>
      <button type="submit">Enviar</button>
    </form>

    <div class="login-link">
      <a href="resposta2.html">Ir para proxima pagina</a>
    </div>
  </div>

</body>
</html>
