<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form action="#" method="POST">
    <h2>Cadastro de Usuário</h2>


    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" minlength="3" required><br>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required><br>

    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade" min="18" max="100" placeholder="18 a 100" required><br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" minlength="6" placeholder="Mínimo 6 caracteres" required><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" pattern="[0-9]{5}-[0-9]{4}" placeholder="99999-9999"><br>

    <button type="submit">Cadastrar</button>
  </form>

</body>
</html>
